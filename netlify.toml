# Настройки Netlify. Сборки нет — публикуется папка как есть.
[build]
  publish = "."
  functions = "netlify/functions"

# Служебные файлы на Netlify не отдаём: PHP-обработчик нужен только
# на обычном хостинге, документация — только для разработчика.
# (Netlify не поддерживает шаблоны вида *.php, поэтому пути перечислены явно.)
[[redirects]]
  from = "/api/lead.php"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/api/lead-config.example.php"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/NEW_CLIENT.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true
